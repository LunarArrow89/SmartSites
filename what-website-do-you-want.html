<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What website do you want? | SmartSites</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:#05091f;display:flex;justify-content:center;padding:90px 20px}.form-page{width:min(900px,100%)}h1{text-align:center;font-size:clamp(2.5rem,7vw,5rem);margin:20px 0 10px;background:linear-gradient(90deg,#ef5350,#f48fb1,#7e57c2,#2196f3,#26c6da,#43a047,#eeff41,#f9a825,#ff5722);background-size:500%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 7s linear infinite}.subtitle{text-align:center;color:#ffffffbb;margin-bottom:45px}.question{background:#ffffff12;border:1px solid #ffffff25;border-radius:24px;padding:25px;margin-bottom:22px;backdrop-filter:blur(12px)}.question h2{margin:0 0 18px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:block;padding:18px;border:1px solid #ffffff25;border-radius:15px;background:#ffffff0d;cursor:pointer;transition:.2s}.choice label:hover{transform:translateY(-2px);background:#ffffff18}.choice input:checked+label{background:linear-gradient(135deg,#784cff55,#00d9ff33);border-color:#fff;box-shadow:0 0 20px #784cff44}.price{display:block;margin-top:7px;font-weight:bold;color:#61eaff}.total{position:sticky;bottom:15px;background:#10132df2;border:1px solid #ffffff35;border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 40px #0008;backdrop-filter:blur(15px)}.total span{font-size:2rem;font-weight:900}.back{display:block;text-align:center;color:#fff;margin-top:20px;text-decoration:none;opacity:.8}.back:hover{opacity:1}@keyframes rainbow{0%{background-position:0 50%}100%{background-position:500% 50%}}
</style>
</head>
<body>
<main class="form-page">
<h1>What website do you want?</h1>
<p class="subtitle">Pick what you want and the total will update automatically!</p>

<!-- EDIT THE QUESTIONS, ANSWERS, AND PRICES BELOW. The calculator reads data-price from each answer. -->
<section class="question"><h2>What kind of website?</h2><div class="choices">
<div class="choice"><input type="radio" name="type" value="50" id="personal"><label for="personal">Personal<span class="price">+$50</span></label></div>
<div class="choice"><input type="radio" name="type" value="75" id="portfolio"><label for="portfolio">Portfolio<span class="price">+$75</span></label></div>
<div class="choice"><input type="radio" name="type" value="100" id="business"><label for="business">Business<span class="price">+$100</span></label></div>
<div class="choice"><input type="radio" name="type" value="100" id="game"><label for="game">Game<span class="price">+$100</span></label></div>
</div></section>

<section class="question"><h2>How many pages?</h2><div class="choices">
<div class="choice"><input type="radio" name="pages" value="25" id="pages1"><label for="pages1">1–3 pages<span class="price">+$25</span></label></div>
<div class="choice"><input type="radio" name="pages" value="50" id="pages2"><label for="pages2">4–7 pages<span class="price">+$50</span></label></div>
<div class="choice"><input type="radio" name="pages" value="75" id="pages3"><label for="pages3">8+ pages<span class="price">+$75</span></label></div>
</div></section>

<section class="question"><h2>What features do you want?</h2><div class="choices">
<div class="choice"><input type="checkbox" name="features" value="20" id="animations"><label for="animations">Animations<span class="price">+$20</span></label></div>
<div class="choice"><input type="checkbox" name="features" value="30" id="graphics"><label for="graphics">Custom graphics<span class="price">+$30</span></label></div>
<div class="choice"><input type="checkbox" name="features" value="30" id="interactive"><label for="interactive">Interactive stuff<span class="price">+$30</span></label></div>
<div class="choice"><input type="checkbox" name="features" value="25" id="mobile"><label for="mobile">Mobile support<span class="price">+$25</span></label></div>
</div></section>

<div class="total">Estimated total<br><span id="total">$0</span></div>
<a class="back" href="index.html">← Back to SmartSites</a>
</main>
<script>
function updateTotal(){let total=0;document.querySelectorAll('input:checked').forEach(input=>total+=Number(input.value)||0);document.getElementById('total').textContent='$'+total.toLocaleString();}
document.querySelectorAll('input').forEach(input=>input.addEventListener('change',updateTotal));
</script>
</body>
</html>
